[project]
name = "twod-fim-jobs"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "twod_fim_jobs.__version__"}

[tool.pixi.workspace]
name = "twod-fim-jobs"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
twod-fim-jobs = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pydantic = ">=2.13.4,<3"
pytest = ">=9.0.3,<10"
ruff = ">=0.15.17,<0.16"
geopandas = ">=1.1.3,<2"
sqlalchemy = ">=2.0.50,<3"
rasterio = ">=1.5.0,<2"

[tool.setuptools]
packages = ["twod_fim_jobs"]

[project.scripts]
twod_fim_jobs = "twod_fim_jobs.cli:main"

[tool.pixi.activation]
scripts = ["load_env.sh"]
