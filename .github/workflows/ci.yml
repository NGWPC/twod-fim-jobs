name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  pip-install-and-health:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install .

      - name: Run health check
        run: twod_fim_jobs health {}

  docker-build-and-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target health -t twod-fim-jobs:ci .

      - name: Run health check
        run: docker run --rm twod-fim-jobs:ci '{}'

  docker-build-job-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [build_model, modify_network]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.target }} image
        run: docker build --target ${{ matrix.target }} -t twod-fim-jobs:${{ matrix.target }} .

      # An empty payload must fail input validation cleanly rather than crash,
      # which proves the entrypoint reaches the job's Inputs model.
      - name: Reject empty payload
        run: |
          if docker run --rm twod-fim-jobs:${{ matrix.target }} '{}'; then
            echo "::error::empty payload was accepted by ${{ matrix.target }}"
            exit 1
          fi
