name: Build and Publish Dev Images

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "pixi.lock"
      - "load_env.sh"
      - "twod_fim_jobs/**"
      - ".github/workflows/build-dev-images.yml"
  workflow_dispatch:

# Keep the floating `dev` tag honest: if two pushes land in quick succession,
# cancel the older run so `dev` can't end up pointing at the earlier commit.
# The sha- tags are immutable, so nothing is lost by cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - build_model
          - run_nd_scenarios-lisflood-gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          # amd64 is required: run_nd_scenarios-lisflood-gpu is built on a
          # CUDA/GPU base image that has no arm64 variant.
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Summarize published tags
        run: |
          {
            echo "### \`${{ matrix.target }}\`"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
