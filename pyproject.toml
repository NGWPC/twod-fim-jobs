[project]
name = "twod-fim-jobs"
dynamic = ["version"]

[tool.pixi.workspace]
name = "twod-fim-jobs"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
pip = "*"
pydantic = ">=2.13.4,<3"
geopandas = ">=1.1.3,<2"
sqlalchemy = ">=2.0.50,<3"
rasterio = ">=1.5.0,<2"

[tool.pixi.feature.prod.pypi-dependencies]
twod-fim-jobs = { path = ".", editable = false }

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3,<10"
ruff = ">=0.15.17,<0.16"

[tool.pixi.feature.dev.pypi-dependencies]
twod-fim-jobs = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = ["prod"], solve-group = "default" }

[tool.setuptools.packages.find]
where = ["."]
include = ["twod_fim_jobs*"]

[project.scripts]
twod_fim_jobs = "twod_fim_jobs.cli:main"

[tool.pixi.activation]
scripts = ["load_env.sh"]
