name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  docker-build-and-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t twod-fim-jobs:ci .

      - name: Run health check
        run: docker run --rm twod-fim-jobs:ci health '{}'
