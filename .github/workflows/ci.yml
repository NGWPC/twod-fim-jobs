name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  pip-install-and-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install .

      - name: Run health check
        run: twod_fim_jobs health {}

  docker-build-and-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t twod-fim-jobs:ci .

      - name: Run health check
        run: docker run --rm twod-fim-jobs:ci health '{}'
